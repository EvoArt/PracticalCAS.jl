name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: write
  contents: read
jobs:
  test:
    permissions:
      actions: write
      contents: read
      id-token: write
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only while the repository is private (macOS/Windows minutes
        # cost 10x/2x); add windows-latest and macos-latest when it goes public.
        version: ['1.10', '1']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
  plotting:
    name: Optional plotting extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Test drawing and exports
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(mktempdir())
          Pkg.develop(path=pwd())
          Pkg.add(url="https://github.com/EvoArt/PracticalBayesPlot.jl")
          include(joinpath(pwd(), "test", "plotting_backend.jl"))   # inline scripts run from a temp directory

